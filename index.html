<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATU Simulation Hospital EHR v1</title>
<style>
:root{--green:#0d4b32;--green2:#176b49;--gold:#d7aa29;--bg:#edf1f3;--panel:#fff;--line:#b7c3ca;--ink:#17242b;--muted:#64737c;--red:#a82434;--blue:#315d7b;--ok:#176f49;--warn:#946d13}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:var(--green);color:#fff;border-bottom:4px solid var(--gold);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:20px}header small{display:block;opacity:.85;margin-top:2px}
.badge{padding:5px 9px;border-radius:12px;background:#ffffff22;font-size:11px;font-weight:700}
.layout{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 66px)}
aside{background:#173f32;color:#fff;padding:10px;position:sticky;top:0;height:calc(100vh - 66px);overflow:auto}
aside .group{font-size:10px;text-transform:uppercase;letter-spacing:.8px;opacity:.7;margin:12px 8px 4px}
aside button{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:9px 10px;border-radius:4px;margin:2px 0}
aside button:hover,aside button.active{background:#2b6b53}
main{padding:14px;min-width:0}
.patientBanner{background:#fff;border:2px solid var(--green2);padding:10px;margin-bottom:12px}
.patientBanner h2{margin:0;color:var(--green)}.meta{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px;font-size:13px}
.meta span{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:800}
.panel{background:#fff;border:1px solid var(--line);border-radius:5px;margin-bottom:12px;box-shadow:0 1px 2px #0001}
.panel h2{margin:0;background:#dfe6ea;border-bottom:1px solid var(--line);padding:9px 11px;font-size:16px;color:#244350}
.body{padding:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{font-size:12px;font-weight:800}input,select,textarea{width:100%;margin-top:4px;border:1px solid #91a1ab;border-radius:3px;padding:8px;background:#fff}
textarea{min-height:90px}.wide{grid-column:1/-1}
.primary{background:var(--green2);color:#fff;border:0;padding:8px 12px;border-radius:4px;font-weight:800}
.secondary{background:#e8eef1;border:1px solid #91a1ab;padding:8px 12px;border-radius:4px}
.danger{background:#fff0f2;color:var(--red);border:1px solid var(--red);padding:8px 12px;border-radius:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:12px;color:var(--muted)}.success{background:#eaf7ef;border:1px solid #9bc7aa;color:var(--ok);padding:8px;border-radius:4px}
.warn{background:#fff7d6;border:1px solid #dac56f;color:#6e5411;padding:8px;border-radius:4px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #c4cdd2;padding:6px;text-align:left;vertical-align:top;font-size:12px}th{background:#edf2f4}
.status{font-size:10px;font-weight:800;border-radius:10px;padding:3px 7px;background:#e7ecef;display:inline-block}
.patientCards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.patientCard{border:1px solid var(--line);background:#fff;padding:10px;border-radius:5px}.patientCard h3{margin:0 0 5px;color:var(--green)}
.levelTabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;border-bottom:2px solid var(--line);padding-bottom:8px}.levelTab{border:1px solid var(--green2);background:#fff;color:var(--green);padding:8px 16px;border-radius:4px 4px 0 0;font-weight:800}.levelTab.active{background:var(--green2);color:#fff}.levelCount{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:10px;background:#00000012;font-size:11px}
.kpi{border:1px solid var(--line);padding:10px;border-radius:4px;background:#fafcfd}.kpi b{font-size:20px}
.qblTotal{background:#fff7d6;border:2px solid var(--gold);padding:12px;border-radius:5px;font-size:16px}.qblTotal b{font-size:24px;color:var(--red)}
.hiddenByMode{display:none!important}
.hiddenByPatient{display:none!important}
@media(max-width:1050px){.patientCards{grid-template-columns:repeat(2,1fr)}.meta{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.layout{display:block}aside{position:static;height:auto}.grid,.grid3,.grid4,.patientCards,.meta{grid-template-columns:1fr}}

.livebar{background:#102d24;color:white;padding:8px 12px;border-radius:5px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.liveDot{width:9px;height:9px;background:#45c174;border-radius:50%;display:inline-block;box-shadow:0 0 0 3px #45c17433}
.releaseCard{border:1px solid var(--line);border-left:5px solid var(--gold);padding:10px;border-radius:4px;margin-bottom:8px;background:white}
.releaseCard.released{border-left-color:var(--ok);background:#f6fbf8}
.releaseCard.message{border-left-color:#4e72a5}
.chartUpdateCard{border:2px solid #c72c43;border-left:8px solid #c72c43;background:#fff7f8}
.releaseChartUpdate{background:#c72c43!important;border-color:#9f1730!important;color:#fff!important;font-size:16px!important;font-weight:900!important;padding:13px 20px!important;min-width:190px}
.releaseChartUpdate:hover{background:#9f1730!important}
.popupOverlay{position:fixed;inset:0;background:#0008;z-index:5000;display:flex;align-items:center;justify-content:center;padding:18px}
.popupCard{background:white;width:min(560px,95vw);border-radius:8px;box-shadow:0 15px 45px #0006;overflow:hidden}
.popupHead{background:var(--green);color:#fff;padding:12px 15px;border-bottom:4px solid var(--gold)}
.popupBody{padding:16px}
.popupActions{padding:10px 16px 16px;display:flex;justify-content:flex-end}
.studentMessage{border-left:4px solid #4e72a5;background:#eef5ff;padding:9px;border-radius:4px;margin-bottom:8px}
.notificationBell{position:relative}
.notificationCount{display:inline-flex;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#c72c43;color:white;align-items:center;justify-content:center;font-size:10px;font-weight:bold;margin-left:4px}
.pendingBadge{background:#fff7d6;color:#6e5411;border:1px solid #d6bc67;padding:3px 7px;border-radius:10px;font-size:10px;font-weight:800}
.releasedBadge{background:#eaf7ef;color:#176f49;border:1px solid #9bc7aa;padding:3px 7px;border-radius:10px;font-size:10px;font-weight:800}
.chartRecord{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:4px;margin:8px 0;background:#fff}
.chartRecord>summary{cursor:pointer;padding:10px 12px;font-weight:800;background:#f3f7f9}
.chartRecordBody{padding:12px;line-height:1.45;overflow:auto}
.chartRecordBody h3,.chartRecordBody h4{color:var(--green);margin:12px 0 6px}
.chartRecordBody table{margin:8px 0;min-width:520px}
.chartRecordBody td{white-space:pre-wrap}
.sourceBadge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:10px;background:#e8eef1;color:#315d7b;font-size:10px;font-weight:800}


.labGroup{border:1px solid var(--line);border-radius:5px;margin-bottom:12px;overflow:hidden;background:#fff}
.labGroupTitle{background:#243d4b;color:#fff;padding:8px 10px;font-weight:800}
.hospitalLabs th{background:#dce5e9;color:#1e3946;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.hospitalLabs td{padding:5px 6px}
.hospitalLabs input,.hospitalLabs select{padding:5px;margin:0;min-width:72px}
.labLow,.labHigh,.labCritical,.labAbnormal{font-weight:800;color:#a82434}
.labNormal{color:#176f49}
.diagAttachment{border:1px solid var(--line);padding:8px;border-radius:4px;margin-top:6px;background:#f8fafb}
.diagPreview{max-width:100%;max-height:480px;border:1px solid #9aa8b0;margin-top:8px}
.fileBadge{display:inline-block;background:#e8eef1;border:1px solid #a9b4bb;padding:3px 7px;border-radius:10px;font-size:10px;font-weight:800}

fieldset{border:1px solid var(--line);margin:12px 0;padding:12px}legend{font-weight:700;color:var(--green)}output{display:block;font-weight:bold;margin:8px 0}.entryFeedback{margin-left:10px;color:var(--green)}
.panel{margin-bottom:8px;box-shadow:none}.panel h2{padding:7px 10px}.panel .body{padding:9px 10px}.chartRecordBody{padding:8px 10px;line-height:1.32}.chartRecordBody br+br{display:none}
.chartRecord{margin:5px 0}.chartRecord>summary{padding:7px 10px}.chartRecordBody h3,.chartRecordBody h4{margin:7px 0 4px}.chartRecordBody table{margin:5px 0}
table th,table td{padding:5px 7px;vertical-align:top;line-height:1.25}.releaseCard{margin:6px 0;padding:8px}.patientCard,.kpi{padding:8px}
.grid,.grid3,.grid4{gap:7px}label input,label select,label textarea{margin-top:3px;padding:6px}textarea{min-height:70px}.actions{gap:6px}
.note{line-height:1.3}.success,.warn{padding:6px}.labGroup{margin-bottom:7px}.labGroupTitle{padding:6px 8px}.diagAttachment{margin-top:4px;padding:6px}
fieldset{margin:8px 0;padding:9px}output{margin:5px 0}.patientBanner{padding:8px;margin-bottom:8px}.meta{gap:6px;margin-top:6px}
[data-admin-record] textarea{min-height:150px;font-family:inherit;line-height:1.35}
.scanGrid{display:grid;grid-template-columns:1fr 38px 1fr 1fr;gap:10px;align-items:start}.scanGrid h3{margin:0 0 5px;color:var(--green2);font-size:14px}.scanArrow{align-self:center;text-align:center;font-size:24px;color:var(--green2)}.verifyBox{border:1px solid var(--line);background:#f3f7f9;padding:9px;border-radius:4px}code{font-size:11px;overflow-wrap:anywhere}
@media(max-width:900px){.scanGrid{grid-template-columns:1fr}.scanArrow{transform:rotate(90deg)}}

</head>

 <button data-view="assessments">Assessments</button>

 <button data-view="notes">Nursing Notes</button>

 <button data-view="orders">Orders</button>
 <button data-view="labs">Labs / Diagnostics</button>
 <button data-view="mar">MAR</button>
 <button data-view="glucose">Blood Glucose &amp; Insulin</button>
 <button data-view="blood" data-specialty="blood">Blood Administration</button>
 <button data-view="imported" class="facultyOnly">Complete Chart Record</button>
 <button data-view="history" class="facultyOnly">Chart History</button>
 <button data-view="inbox">Messages / Alerts</button>
 <div class="group">Faculty</div>
 <button data-view="faculty" class="facultyOnly">Faculty Live Control</button>
 <button data-view="barcodes" class="facultyOnly">Medication & Barcode Center</button>
 <button data-view="debrief" class="facultyOnly">Debrief / Audit</button>
</aside>
<main>
 <div id="patientBanner" class="patientBanner" style="display:none"></div>
 <section id="view"></section>
</main>
</div>

 h=h.replace(/&lt;[\s\S]*?&gt;/g,"");

const FILE_DB_NAME="ATU_EHR_FILES";
const FILE_DB_STORE="files";
function openFileDb(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(FILE_DB_NAME,1);
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(FILE_DB_STORE))db.createObjectStore(FILE_DB_STORE)};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
}
async function storeDiagnosticFile(file){
 const db=await openFileDb();
 const key=uid("diagfile");
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(FILE_DB_STORE,"readwrite");
  tx.objectStore(FILE_DB_STORE).put(file,key);
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
 });
 return key;
}
async function getDiagnosticFile(key){
 const db=await openFileDb();
 return await new Promise((resolve,reject)=>{
  const tx=db.transaction(FILE_DB_STORE,"readonly"),req=tx.objectStore(FILE_DB_STORE).get(key);
  req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);
 });
}
async function deleteDiagnosticFile(key){
 try{const db=await openFileDb();await new Promise((res,rej)=>{const tx=db.transaction(FILE_DB_STORE,"readwrite");tx.objectStore(FILE_DB_STORE).delete(key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}
}
async function openDiagnosticFile(fileId){
 const meta=(state.diagnosticFiles||[]).find(f=>f.id===fileId);
 if(!meta){alert("Attachment metadata was not found.");return}
 const file=await getDiagnosticFile(meta.storageKey);
 if(!file){alert("The attachment is not available in this browser. It may have been uploaded on another device.");return}
 const url=URL.createObjectURL(file);
 window.open(url,"_blank");
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function queueRelease(kind,patientId,title,content,extra={}){
 state.releaseQueue ||= [];
 const item={
   id:uid("release"),kind,patientId,title,content,
   status:"pending",createdAt:nowLocal(),releasedAt:"",
   ...extra
 };
 state.releaseQueue.push(item);
 audit("Pending item created",patientId,`${kind}: ${title}`);
 liveSave("queue_changed",{patientId,itemId:item.id});
 return item;
}
function releaseItem(id){
 const item=(state.releaseQueue||[]).find(x=>x.id===id);
 if(!item||item.status==="released")return;
 item.status="released";item.releasedAt=nowLocal();

 if(!item.chartRecordId&&item.kind==="order"){
   state.orders.push({
    id:uid("order"),patientId:item.patientId,time:item.releasedAt,
    provider:item.provider||activePatient()?.provider||"Provider",
    type:item.orderType||"Other",text:item.content,status:"Active",enteredBy:"Faculty Release"
   });
 }else if(!item.chartRecordId&&item.kind==="result"){
   if(Array.isArray(item.labRows)&&item.labRows.length){
    for(const row of item.labRows){
     if(!String(row.value||"").trim())continue;
     state.labs.push({id:uid("lab"),patientId:item.patientId,time:item.releasedAt,type:"Laboratory",test:row.test,result:row.value,reference:row.reference||"",flag:row.flag||"Normal",comments:`${item.title} • Released by faculty`});
    }
   }else{
    state.labs.push({
     id:uid("lab"),patientId:item.patientId,time:item.releasedAt,type:item.resultType||"Laboratory",
     test:item.title,result:item.content,reference:item.reference||"",flag:item.flag||"Normal",comments:"Released by faculty"
    });
   }
   for(const fileId of (item.fileIds||[])){
    const f=(state.diagnosticFiles||[]).find(x=>x.id===fileId);
    if(f){f.status="released";f.releasedAt=item.releasedAt;}
   }
 }else if(!item.chartRecordId&&item.kind==="message"){
   state.messages ||= [];
   state.messages.push({
    id:uid("msg"),patientId:item.patientId,at:item.releasedAt,
    from:"Faculty",to:"Student",subject:item.title,message:item.content,read:false,releaseItemId:item.id
   });
 }
 createNotificationForRelease(item);
 audit("Faculty item released",item.patientId,`${item.kind}: ${item.title}`);
 liveSave("item_released",{patientId:item.patientId,itemId:item.id,kind:item.kind,title:item.title});
 renderFaculty();
}
function createNotificationForRelease(item){
 state.notifications ||= [];
 state.notifications.push({
  id:uid("notif"),patientId:item.patientId,createdAt:nowLocal(),
  type:item.kind,title:item.kind==="order"?"New Provider Order":item.kind==="result"?"New Result":"Faculty Message",
  body:item.kind==="message"?item.content:item.title,
  releaseItemId:item.id,read:false
 });
}

function receiveLiveEvent(evt){

});

function renderInbox(){
 if(!requirePatient())return;
 const p=activePatient();

 const notifs=(state.notifications||[]).filter(n=>n.patientId===p.id).slice().reverse();

  let changed=false;
  for(const m of msgs)if(!m.read){m.read=true;changed=true}

 saveDiagPending.onclick=async()=>{
  const patientId=selectedId,title=diagTitle.value.trim(),impression=diagImpression.value.trim(),file=diagFileInput.files?.[0];
  if(!title){alert("Enter a diagnostic title.");return}
  if(!file){alert("Choose a PDF, JPG/JPEG, or PNG file.");return}
  const allowed=["application/pdf","image/jpeg","image/png"];
  if(!allowed.includes(file.type)){alert("Only PDF, JPG/JPEG, and PNG files are supported.");return}
  try{
   const storageKey=await storeDiagnosticFile(file);
   const meta={id:uid("diag"),patientId,title,fileName:file.name,mimeType:file.type,size:file.size,storageKey,status:"pending",uploadedAt:nowLocal(),releasedAt:""};
   state.diagnosticFiles ||= [];state.diagnosticFiles.push(meta);
   queueRelease("result",patientId,title,impression||"Diagnostic report/image available.",{resultType:"Imaging",flag:"Abnormal",fileIds:[meta.id]});
   renderFaculty();
  }catch(e){console.error(e);alert("The file could not be saved in this browser.");}
 };

 document.querySelectorAll(".releaseNow").forEach(b=>b.onclick=()=>releaseItem(b.dataset.id));

 savePin.onclick=()=>{state.settings.facultyPin=pinSetting.value.trim()||"2026";liveSave("settings_changed");alert("Faculty PIN saved.")};
 resetPatient.onclick=()=>{
  const id=selectedId;
  if(!confirm("Reset student charting for this patient and return the scenario to its starting state?"))return;
  for(const k of ["orders","assessments","vitals","io","notes","labs","mar","laborProgress","postpartumRecovery","pphPads","pphMedications","bloodAdministration"])if(state[k])state[k]=state[k].filter(x=>x.patientId!==id);
  state.surgicalChecklist=(state.surgicalChecklist||[]).filter(x=>x.patientId!==id);
  state.surgicalAssessments=(state.surgicalAssessments||[]).filter(x=>x.patientId!==id);
  state.releaseQueue=(state.releaseQueue||[]).filter(x=>x.patientId!==id);
  state.messages=(state.messages||[]).filter(x=>x.patientId!==id);
  state.notifications=(state.notifications||[]).filter(x=>x.patientId!==id);
  state.diagnosticFiles=(state.diagnosticFiles||[]).filter(x=>x.patientId!==id);
  state.labPanels=(state.labPanels||[]).filter(x=>x.patientId!==id);
  if(state.scenarioStage)delete state.scenarioStage[id];
  state.audit=state.audit.filter(x=>x.patientId!==id);
  if(id==="amelia-sung")ensureSeededAmelia();
  if(id==="jane-fowler")ensureSeededJane();
  audit("Simulation reset",id,"Patient chart returned to starting state; baseline scenario data restored");
  liveSave("simulation_reset",{patientId:id});renderFaculty();
 };
 downloadBackup.onclick=()=>{
  const blob=new Blob([JSON.stringify({application:"ATU Simulation Hospital EHR",version:"v4",exportedAt:new Date().toISOString(),data:state},null,2)],{type:"application/json"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`ATU_EHR_Backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u)
 };
}
function renderDebrief(){
 if(!isFaculty()){currentView="patients";render();return}
 const opts=state.patients.map(p=>`<option value="${esc(p.id)}" ${p.id===activePatientId?"selected":""}>${esc(p.name)} — ${esc(p.mrn)}</option>`).join("");
 document.getElementById("view").innerHTML=panel("Debrief / Audit",`<div class="grid"><label>Patient<select id="dPatient">${opts}</select></label><div style="align-self:end"><button id="buildDebrief" class="primary">Build Debrief</button></div></div><div id="dResult" style="margin-top:10px"></div>`);
 buildDebrief.onclick=()=>{const id=dPatient.value,p=state.patients.find(x=>x.id===id),a=state.audit.filter(x=>x.patientId===id),counts={assess:state.assessments.filter(x=>x.patientId===id).length,orders:state.orders.filter(x=>x.patientId===id).length,notes:state.notes.filter(x=>x.patientId===id).length,vitals:state.vitals.filter(x=>x.patientId===id).length};
 const janeDebrief=id==="jane-fowler"?`<div class="patientCard" style="margin-top:10px"><b>Jane Fowler Debrief Focus</b><br><span class="note">
 • Recognize opioid adverse effects and respiratory depression.<br>
 • Explain interventions for respiratory depression and bag-mask ventilation.<br>
 • Review assessment findings, missed cues, response to Narcan, and stability after treatment.<br>
 • Reflect on what went well and what would be handled differently next time.
 </span></div>`:"";
 dResult.innerHTML=`<div class="success"><b>${esc(p.name)}</b> — MRN ${esc(p.mrn)}</div><div class="grid4" style="margin:10px 0"><div class="kpi"><span class="note">Assessments</span><br><b>${counts.assess}</b></div><div class="kpi"><span class="note">Orders</span><br><b>${counts.orders}</b></div><div class="kpi"><span class="note">Notes</span><br><b>${counts.notes}</b></div><div class="kpi"><span class="note">Vitals</span><br><b>${counts.vitals}</b></div></div><table><thead><tr><th>Time</th><th>Event</th><th>Details</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.at)}</td><td>${esc(x.type)}</td><td>${esc(x.details)}</td></tr>`).join("")||'<tr><td colspan="3">No activity.</td></tr>'}</tbody></table>`;};
}
document.querySelectorAll("aside button").forEach(b=>b.onclick=()=>{if(!isFaculty()&&b.classList.contains("facultyOnly")){alert("Faculty Mode is required.");return}currentView=b.dataset.view;render()});
document.getElementById("toggleMode").onclick=toggleMode;
applyMode();initializeNativeCharts();initializeAdminEnhancements();initializeMedicationSystem();
render();
</script>
</body>
</html>
